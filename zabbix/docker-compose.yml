# Zabbix 7.0 LTS with PostgreSQL. Start with: docker compose up -d
# Web UI: http://localhost:8081  (change the default admin password after first login)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: change-me-zabbix
      POSTGRES_DB: zabbix
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: change-me-zabbix
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"
    depends_on:
      - postgres
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: change-me-zabbix
      POSTGRES_DB: zabbix
      PHP_TZ: Asia/Dubai
    ports:
      - "8081:8080"
    depends_on:
      - zabbix-server
    restart: unless-stopped

volumes:
  pg_data:
