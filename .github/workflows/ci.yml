name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: app/requirements.txt }
      - run: pip install -r app/requirements.txt pytest ruff
      - run: ruff check app tests
      - run: pytest -q

  infra-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      - name: Validate AWS and Azure configs
        run: |
          for cloud in aws azure; do
            terraform -chdir=terraform/$cloud init -backend=false
            terraform -chdir=terraform/$cloud validate
          done
      - run: pip install ansible-core ansible-lint && ansible-galaxy collection install community.general
      - run: ansible-lint ansible/site.yml
      - name: ShellCheck scripts
        run: shellcheck scripts/*.sh

  image:
    needs: [test, infra-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/it-ops-monitor:${{ github.sha }} .
      - name: Scan image with Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/it-ops-monitor:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Push image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository_owner }}/it-ops-monitor:${{ github.sha }}
