global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: it-ops-monitor      # service up/down + response time
    static_configs:
      - targets: ["app:8000"]

  - job_name: node                # the server itself
    static_configs:
      - targets: ["node-exporter:9100"]
