services:
  app:
    build: .
    image: ghcr.io/ahmed-elgamil-devops/it-ops-monitor:latest
    ports: ["8000:8000"]
    volumes:
      - ./app/targets.yml:/srv/app/targets.yml:ro   # edit targets without rebuilding
    environment:
      CHECK_INTERVAL: "30"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  node-exporter:            # server CPU / RAM / disk metrics
    image: prom/node-exporter:v1.8.1
    pid: host
    volumes:
      - /:/host:ro,rslave
    command: ["--path.rootfs=/host"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
